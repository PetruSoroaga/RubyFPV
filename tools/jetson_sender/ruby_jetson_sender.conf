# RubyFPV Jetson sender configuration.
# Installed to /etc/ruby_jetson_sender.conf
# Every key here can also be given on the command line as --key-with-dashes.
# Restart the service after changing this file:
#    sudo systemctl restart ruby_jetson_sender

# --- network ---------------------------------------------------------------
# IP of the RubyFPV vehicle (the Raspberry Pi) on the direct Ethernet link.
# Use 'auto' to learn it from the first control packet the Pi sends.
host = 192.168.10.1
# UDP port on the Pi where ruby_rt_vehicle reads the RTP/H264 stream.
port = 5600
# UDP port on this Jetson where we listen for control messages from the Pi.
control_port = 5601
# If set, control messages from any other IP are dropped.
control_allow =
# RTP payload size. Keep below the link MTU so nothing gets fragmented.
mtu = 1400

# --- capture ---------------------------------------------------------------
# argus = nvarguscamerasrc (CSI camera), v4l2 = USB camera, test = test pattern
source = argus
sensor_id = 0
device = /dev/video0
width = 1280
height = 720
fps = 60

# --- encoder ---------------------------------------------------------------
# auto uses nvv4l2h264enc when present, else x264enc (software, for bench tests)
encoder = auto
# baseline | main | high
profile = baseline
# Initial bitrate in bps. Ruby overrides it live through the control channel.
bitrate = 6000000
min_bitrate = 250000
max_bitrate = 25000000
# Keyframe (IDR) interval in milliseconds.
keyframe_ms = 200
# nvv4l2h264enc rate control: 0 = variable, 1 = constant
control_rate = 1
# nvv4l2h264enc preset: 1 = ultra fast (lowest latency)
preset_level = 1
# How to handle the qp_delta control message: ignore (log once) or map it to
# the encoder qp-range property.
qp_map = ignore
qp_min = 10
qp_max = 51

# --- housekeeping ----------------------------------------------------------
# Seconds between throughput log lines, 0 disables them.
stats_interval = 10
# Restart the pipeline if no encoded data is produced for this many seconds.
watchdog = 5
restart_delay = 2
max_restart_delay = 10
